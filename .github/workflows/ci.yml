name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate submissions
        run: npm run check:submissions

      - name: Test repository scripts
        run: npm run test:evaluation

      - name: Build bundles
        run: npm run build

      - name: Check catalog export
        run: npm run build -- --catalog-output "$RUNNER_TEMP/catalog"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: industry-template-bundles
          path: public/bundles
