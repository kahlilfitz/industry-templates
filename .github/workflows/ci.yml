name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate submissions
        run: npm run check:submissions

      - name: Check per-version test data
        run: npm run check:test-data

      - name: Check vendored shared modules
        run: npm run check:shared

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test MOS3 plugins against their current-version test data
        run: |
          set -euo pipefail
          for meta in submissions/*/*/metadata.json; do
            [ "$(node -p "require('./$meta').packageFormat || ''")" = "mos3" ] || continue
            dir=$(dirname "$meta"); slug=$(basename "$dir"); industry=$(basename "$(dirname "$dir")")
            version=$(node -p "require('./$meta').version")
            tests="test-data/$industry/$slug/$version/tests"
            for runner in run_tests.py test_engines.py; do
              if [ -f "$tests/$runner" ]; then
                echo "== $slug $version $runner"
                python "$tests/$runner" --plugin-root "$dir"
              fi
            done
          done

      - name: Build bundles
        run: npm run build

      - name: Check catalog export
        run: npm run build -- --catalog-output "$RUNNER_TEMP/catalog"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: industry-template-bundles
          path: public/bundles
